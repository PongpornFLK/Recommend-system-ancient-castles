services:
  # --- Backend Service (FastAPI) ---
  backend:
    build: ./backend
    container_name: fastapi-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # ให้ DATABASE_URL ดึงจากไฟล์ .env โดยตรงแล้ว (ลบการตั้งค่า override ตรงนี้ทิ้ง)
      FRONTEND_URL: "http://localhost:3000"
    ports:
      - "8000:8000"
    networks:
      - app-networks
    # สั่งรัน uvicorn ให้รับ connection จากภายนอก container (--host 0.0.0.0)
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # --- Frontend Service (Next.js) ---
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=AIzaSyDs-WzwwttdnD5E1SIKrYGLpdxyWINi2ps
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-networks

networks:
  app-networks:
    driver: bridge
