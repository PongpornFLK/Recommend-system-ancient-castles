services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-networks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: fastapi-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ZILLIZ_URI: ${ZILLIZ_URI}
      ZILLIZ_TOKEN: ${ZILLIZ_TOKEN}
    ports:
      - "8000:8000"
    networks:
      - app-networks
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # ถ้าจะ dev แล้วอยาก hot reload ค่อยเปิด 2 บรรทัดนี้ทีหลัง
    # volumes:
    #   - ./backend:/app

volumes:
  pg_data:

networks:
  app-networks:
    driver: bridge
