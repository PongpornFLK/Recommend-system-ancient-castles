services:
  # --- 1. Backend Service (FastAPI) ---
  backend:
    build: ./backend
    container_name: fastapi-backend
    restart: always
    env_file:
      - ./backend/.env 
    ports:
      - "8000:8000"
    networks:
      - app-networks
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # --- 2. Frontend Service (Next.js) ---
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    env_file:
      - ./frontend/.env.local 
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-networks

# ลบ volumes: pg_data: ออกเรียบร้อย
networks:
  app-networks:
    driver: bridge